name: CI - Build Python Agent Framework Sample Agent
permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
    paths:
      - 'python/agent-framework/sample-agent/**/*'
      - '.github/workflows/ci-python-agentframework-sampleagent.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'python/agent-framework/sample-agent/**/*'
      - '.github/workflows/ci-python-agentframework-sampleagent.yml'

jobs:
  validate-sample:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./python/agent-framework/sample-agent

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display environment
      run: |
        python --version
        pip --version

    - name: Install dependencies from PyPI
      run: |
        python -m pip install --upgrade pip
        pip install --pre -e .

    - name: Display installed package versions
      run: |
        pip show microsoft-agents-a365-sdk microsoft-agents-core microsoft-agents-orchestration microsoft-agents-teams-channel microsoft-agents-python-channels 2>/dev/null || echo "Package version information unavailable"
      shell: bash

    - name: Verify dependencies installed
      run: |
        pip list
        python -c "import aiohttp; print('OK: aiohttp')"
        python -c "import fastapi; print('OK: fastapi')"
        python -c "import pydantic; print('OK: pydantic')"

    - name: Compile and validate Python syntax
      run: |
        python -m compileall -f -q . || (echo "Syntax validation failed" && exit 1)
        echo "All Python files compiled successfully"

    - name: Test imports
      continue-on-error: true
      run: |
        python -c "import agent"
        python -c "import agent_interface"
        python -c "import host_agent_server"

    - name: Summary
      if: always()
      shell: bash
      run: |
        echo "### Agent Framework Sample - Python ${{ matrix.python-version }} on ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY

  build-docker-pr:
    name: Build Docker Image with PR Packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./python/agent-framework/sample-agent

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine branch name
      id: branch
      run: |
        # For PRs, use the head branch; for push events, use the current branch
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BRANCH_NAME="${{ github.head_ref }}"
        else
          BRANCH_NAME="${{ github.ref_name }}"
        fi
        echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "Using branch: $BRANCH_NAME"

    - name: Generate requirements-pr.txt with branch name
      run: |
        sed 's/{{BRANCH_NAME}}/${{ steps.branch.outputs.name }}/g' requirements-pr.txt > requirements-pr-generated.txt
        echo "Generated requirements file:"
        cat requirements-pr-generated.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./python/agent-framework/sample-agent
        file: ./python/agent-framework/sample-agent/Dockerfile
        push: false
        tags: agent-framework-sample:pr-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          REQUIREMENTS_FILE=requirements-pr-generated.txt

    - name: Test Docker image
      run: |
        docker run --rm agent-framework-sample:pr-${{ github.sha }} python -c "
        import sys
        try:
            # Verify PR packages are installed
            import microsoft_agents_a365_tooling
            import microsoft_agents_a365_runtime
            import microsoft_agents_a365_notifications
            print('✅ All Microsoft Agent 365 SDK packages imported successfully')
            sys.exit(0)
        except ImportError as e:
            print(f'❌ Import failed: {e}')
            sys.exit(1)
        "

    - name: Summary
      if: always()
      shell: bash
      run: |
        echo "### Docker Build - Dynamic PR Packages" >> $GITHUB_STEP_SUMMARY
        echo "Image built with packages from branch: **${{ steps.branch.outputs.name }}**" >> $GITHUB_STEP_SUMMARY
