[project]
name = "sample-agentframework-agent"
version = "0.1.0"
description = "Sample Agent Framework Agent using Microsoft Agent 365 SDK"
authors = [
    { name = "Microsoft", email = "support@microsoft.com" }
]
dependencies = [
    # AgentFramework SDK - The official package
    "agent-framework-azure-ai",
    
    # Azure AI Projects - explicitly require pre-release version
    "azure-ai-agents>=1.2.0b5",
    "azure-ai-projects>=2.0.0b2",

    # Microsoft Agents SDK - Official packages for hosting and integration
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-hosting-core",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",

    # Azure SDK components
    "azure-identity",

    # Core dependencies
    "python-dotenv",
    "aiohttp",

    # HTTP server support for MCP servers
    "uvicorn[standard]>=0.20.0",
    "fastapi>=0.100.0",

    # HTTP client
    "httpx>=0.24.0",

    # Data validation
    "pydantic>=2.0.0",

    # Additional utilities
    "typing-extensions>=4.0.0",

    # Microsoft Agent 365 SDK packages - Install from PR #105 branch
    # Branch: copilot/implement-chat-history-api (testing chat history API changes)
    "microsoft_agents_a365_tooling @ git+https://github.com/microsoft/Agent365-python.git@copilot/implement-chat-history-api#subdirectory=libraries/microsoft-agents-a365-tooling",
    "microsoft_agents_a365_tooling_extensions_agentframework @ git+https://github.com/microsoft/Agent365-python.git@copilot/implement-chat-history-api#subdirectory=libraries/microsoft-agents-a365-tooling-extensions-agentframework",
    "microsoft_agents_a365_observability_core @ git+https://github.com/microsoft/Agent365-python.git@copilot/implement-chat-history-api#subdirectory=libraries/microsoft-agents-a365-observability-core",
    "microsoft_agents_a365_observability_extensions_agent_framework @ git+https://github.com/microsoft/Agent365-python.git@copilot/implement-chat-history-api#subdirectory=libraries/microsoft-agents-a365-observability-extensions-agentframework",
    "microsoft_agents_a365_runtime @ git+https://github.com/microsoft/Agent365-python.git@copilot/implement-chat-history-api#subdirectory=libraries/microsoft-agents-a365-runtime",
    "microsoft_agents_a365_notifications @ git+https://github.com/microsoft/Agent365-python.git@copilot/implement-chat-history-api#subdirectory=libraries/microsoft-agents-a365-notifications"
]
requires-python = ">=3.11"

# Package index configuration
# PyPI is the default/primary source, local packages are fallback
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
